<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paramountcy</title>
<link rel="stylesheet" href="../../packages/ui/src/kit.css">
<style>
  /* The Recite Game: one screen, one card, one bar, two doors.
     Everything the old client stacked on this page — panels, lenses, mode
     tabs, drawers — is deliberately gone. */
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--table, #23404a); }

  #stage { position: fixed; inset: 0; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    cursor: grab; touch-action: none; }
  #map:active { cursor: grabbing; }

  /* ── Top strip ─────────────────────────────────────────────────────── */
  #hud { position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; z-index: 5;
    background: var(--paper); border: 1px solid var(--rule);
    box-shadow: var(--shadow-lift); padding: 7px 14px; font-size: 13px; }
  #hud .sep { width: 1px; height: 18px; background: var(--rule); }
  #day { font-weight: 700; }
  #era { color: var(--ink-soft); font-family: var(--mono); font-size: 11px; }
  #speed { font-size: 13px; padding: 2px 9px; cursor: pointer; }
  .meter { display: flex; align-items: center; gap: 6px; }
  .meter .k { font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-soft); }
  .meter .bar { width: 64px; height: 8px; border: 1px solid var(--ink);
    background: var(--sheet-shade); position: relative; }
  .meter .bar i { position: absolute; inset: 0 auto 0 0; display: block; }
  #orderbar { background: var(--gold, #C9A227); }
  #foodbar { background: #7A8F52; }
  #popn { font-weight: 700; font-variant-numeric: tabular-nums; }
  #money { font-weight: 700; color: var(--warn); }

  /* ── The card & the bar ────────────────────────────────────────────── */
  #cardslot { position: absolute; left: 50%; bottom: 66px; transform: translateX(-50%);
    z-index: 5; width: min(430px, 86vw); background: var(--paper);
    border: 1px solid var(--ink); box-shadow: var(--shadow-lift);
    padding: 12px 16px 10px; text-align: center; }
  #cardbook { font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-soft); }
  #cardtitle { font-size: 16px; font-weight: 700; margin: 2px 0 4px;
    text-wrap: balance; }
  #cardtext { font-size: 12.5px; line-height: 1.5; color: var(--ink-soft);
    font-style: italic; }
  #recitehint { font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-faint); margin-top: 8px; }

  #recitebar { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%);
    z-index: 5; width: min(430px, 86vw); height: 18px; background: var(--sheet);
    border: 1px solid var(--ink); overflow: hidden; opacity: 0; transition: opacity .12s; }
  #recitebar.on { opacity: 1; }
  #recitefill { display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--gold, #C9A227), #DBB43A); }

  /* ── The two doors ─────────────────────────────────────────────────── */
  .door { position: absolute; bottom: 14px; z-index: 5; font-size: 13px;
    padding: 8px 14px; cursor: pointer; background: var(--paper);
    border: 1px solid var(--rule); box-shadow: var(--shadow-lift); }
  .door:hover { box-shadow: var(--shadow-contact); }
  #btnCards { left: 14px; }
  #btnBooks { right: 14px; }

  /* ── Full-screen pages ─────────────────────────────────────────────── */
  .page { position: fixed; inset: 0; z-index: 20; background: var(--paper);
    overflow-y: auto; padding: 26px clamp(16px, 6vw, 72px); }
  .page[hidden] { display: none; }
  .page h1 { margin: 0 0 4px; font-size: 26px; }
  .page .lede { color: var(--ink-soft); font-size: 13px; margin: 0 0 20px; }
  .page .back { position: fixed; top: 14px; right: 18px; font-size: 13px;
    padding: 6px 12px; cursor: pointer; background: var(--sheet);
    border: 1px solid var(--rule); }

  /* ── Toasts ────────────────────────────────────────────────────────── */
  #toasts { position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
    z-index: 6; display: flex; flex-direction: column; gap: 6px; align-items: center;
    pointer-events: none; }
  .toast { background: var(--paper); border: 1px solid var(--rule);
    box-shadow: var(--shadow-lift); padding: 6px 14px; font-size: 12.5px;
    transition: opacity .4s; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="map" tabindex="0" role="application"
    aria-label="The living map. Hold Space to recite the current card to the population."></canvas>

  <div id="hud">
    <span id="day">Day 0</span>
    <span id="era">6000 BCE</span>
    <button class="btn" id="speed" title="Speed: one day is ten seconds; press to go faster.">▸</button>
    <span class="sep"></span>
    <span class="meter" title="The population — the children you are raising."><span class="k">Pop</span><span id="popn">0</span></span>
    <span class="meter" title="Order: how far this population has come from the wild. Recite morals to raise it; it frays on its own."><span class="k">Order</span><span class="bar"><i id="orderbar"></i></span></span>
    <span class="meter" title="Food: the hunt, then the harvest. An empty pot kills."><span class="k">Food</span><span class="bar"><i id="foodbar"></i></span></span>
    <span id="money" hidden>₹ 0</span>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <div id="cardslot">
    <div id="cardbook"></div>
    <div id="cardtitle"></div>
    <div id="cardtext"></div>
    <div id="recitehint">hold [space] to recite</div>
  </div>
  <div id="recitebar"><i id="recitefill"></i></div>

  <button class="door" id="btnCards">🃏 Cards</button>
  <button class="door" id="btnBooks">📖 Books</button>
</div>

<div class="page" id="page-cards" hidden>
  <button class="back" data-back>← back to the stage</button>
  <h1>The Collection</h1>
  <p class="lede">Every card you will ever recite, face-down until its level. Coming with the deck.</p>
</div>

<div class="page" id="page-books" hidden>
  <button class="back" data-back>← back to the stage</button>
  <h1>The Library</h1>
  <p class="lede">The books, by shelf and by subject — and a place for your own. Coming with the deck.</p>
</div>

<script type="module" src="./src/game.js"></script>
</body>
</html>
