<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paramountcy</title>
<link rel="stylesheet" href="../../packages/ui/src/kit.css">
<style>
  html,body { height:100%; }
  #app { display:grid; grid-template-columns: 1fr 322px; height:100dvh; gap:0; }
  @media (max-width: 900px) { #app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } }

  #stage { position:relative; overflow:hidden; }
  #map { display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
  #map.drag { cursor:grabbing; }

  #hud { position:absolute; left:14px; top:14px; display:flex; gap:8px; align-items:center;
         background:var(--paper); border:1px solid var(--rule); padding:6px 10px;
         box-shadow:var(--shadow-contact); }
  #year { font-size:19px; font-weight:600; font-variant-numeric:tabular-nums; min-width:104px; }
  #era  { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); }

  #scrub { position:absolute; left:14px; bottom:52px; display:flex; align-items:center; gap:8px;
           background:var(--paper); border:1px solid var(--rule); padding:5px 10px;
           box-shadow:var(--shadow-contact); }
  #scrubber { width:280px; accent-color:var(--gold); }
  #scrub-year { font-family:var(--mono); font-size:11px; min-width:66px; }
  #modes { position:absolute; left:14px; bottom:14px; display:flex; gap:2px; }
  #notices { position:absolute; right:14px; top:14px; width:290px;
             display:flex; flex-direction:column; gap:6px; pointer-events:none; }
  #loading { position:absolute; inset:0; display:grid; place-items:center;
             background:var(--table); font-size:14px; color:var(--ink-soft); z-index:9; }

  aside { background:var(--sheet); border-left:1px solid var(--rule);
          overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:12px; }
  aside::-webkit-scrollbar { width:9px; }
  aside::-webkit-scrollbar-thumb { background:var(--table-deep); }

  .panel h2 { margin:0 0 8px; font-size:11px; letter-spacing:.12em;
              text-transform:uppercase; color:var(--ink-soft); font-weight:600; }
  .acts { display:flex; flex-wrap:wrap; gap:5px; }
  #chest { max-height:270px; overflow-y:auto; }
  #frontier { font-size:12px; }
  #locked { margin-top:8px; font-size:11px; color:var(--ink-soft); }
  #locked div { padding:2px 0; }
  #locked b { color:var(--warn); }
  .stances { display:flex; gap:3px; }
  .stances button { font-size:10px; padding:1px 6px; }
  #people { font-size:12px; }
  .per { display:flex; align-items:baseline; gap:7px; padding:4px 0;
         border-bottom:1px solid rgba(42,33,24,.08); }
  .per .nm { flex:1; }
  .per .role { font-size:10px; letter-spacing:.06em; text-transform:uppercase;
               color:var(--ink-soft); }
  .per button { font-size:11px; padding:2px 8px; }
  .prov { font-size:9px; letter-spacing:.08em; padding:1px 4px; border:1px solid var(--rule);
          color:var(--ink-soft); }
  .prov--SOURCED { border-color:var(--land-fertile); color:#4c6136; }
  .prov--DERIVED { border-color:var(--land-arid); }
  .prov--SYNTHESIZED { border-style:dashed; opacity:.75; }
  .disputed { color:var(--warn); font-weight:600; }
  #endowments { margin-top:7px; font-size:11px; }
  .endw { display:flex; justify-content:space-between; padding:2px 0; color:var(--ink-soft); }
  .endw.dead { opacity:.45; text-decoration:line-through; }
  #routes { font-size:12px; }
  .route { padding:4px 0; border-bottom:1px solid rgba(42,33,24,.08); }
  .route .nm { display:flex; justify-content:space-between; }
  .route .four { display:flex; gap:6px; margin-top:3px; }
  .route .four span { flex:1; }
  .route .four i { display:block; height:4px; background:var(--sheet-shade);
                   box-shadow:inset 0 1px 2px rgba(42,33,24,.3); }
  .route .four i b { display:block; height:100%; background:var(--table-deep); }
  .route.choked .nm { color:var(--warn); font-weight:600; }
  #log { max-height:150px; overflow-y:auto; font-size:12px; line-height:1.5; }
  #log div { padding:1px 0; }
  #log .y { color:var(--ink-faint); font-family:var(--mono); font-size:10px; margin-right:6px; }
</style>
</head>
<body data-era="neolithic">
<div id="app">
  <div id="stage">
    <canvas id="map"></canvas>
    <div id="loading">building the world…</div>
    <div id="hud">
      <div class="clockbar">
        <div class="gnomon" id="gnomon"></div>
        <div>
          <div id="year">6000 BCE</div>
          <div id="era">Early Neolithic</div>
        </div>
      </div>
      <div class="rule" style="width:1px;height:30px;margin:0 4px"></div>
      <button class="btn" id="play">▶ play</button>
      <button class="btn" id="speed">1×</button>
      <div class="rule" style="width:1px;height:30px;margin:0 4px"></div>
      <button class="btn" id="soundbtn" title="The audio is the corpus: fuller when more is held, darker when more is lost, and silent in 1193.">♪ off</button>
      <button class="btn" id="share" title="Copy a link that opens this exact campaign.">share</button>
      <button class="btn" id="savebtn" title="Download the campaign. It is a few kilobytes.">save</button>
      <label class="btn" for="loadfile" title="Open a saved campaign.">load
        <input type="file" id="loadfile" accept=".json" hidden></label>
    </div>
    <div id="scrub"><input type="range" id="scrubber" min="0" max="100" value="100"
      title="Scrub the campaign. A replay is the same world evaluated at a different year."><span id="scrub-year"></span></div>
    <div id="modes" class="tabs"></div>
    <div id="notices"></div>
    <div id="drawer"><div id="drawer-inner"></div>
      <button class="btn" id="drawer-close">close</button></div>
  </div>

  <aside>
    <div class="panel ledger">
      <h2>The Ledger</h2>
      <div class="ledger-row"><span>Grain</span><span class="v" id="grain">—</span></div>
      <div class="ledger-row"><span>Coin</span><span class="v" id="coin">—</span></div>
      <div class="ledger-row"><span>Farmers</span><span class="v" id="farmers">—</span></div>
      <div class="ledger-row"><span>Reciters</span><span class="v" id="reciters">—</span></div>
      <div class="ledger-row"><span>Scribes</span><span class="v" id="scribes">—</span></div>
      <div class="ledger-row"><span>Soldiers</span><span class="v" id="soldiers">—</span></div>
    </div>

    <div class="panel">
      <h2>Decisions</h2>
      <div class="acts" id="acts"></div>
    </div>

    <div class="panel">
      <h2>People <span class="tiny muted" id="people-sum"></span></h2>
      <div id="people"></div>
      <div id="endowments"></div>
    </div>

    <div class="panel">
      <h2>The Frontier <span class="tiny muted" id="frontier-sum"></span></h2>
      <div id="frontier"></div>
    </div>

    <div class="panel">
      <h2>Survey <span class="tiny muted" id="survey-sum"></span></h2>
      <div id="survey"></div>
    </div>

    <div class="panel">
      <h2>Routes</h2>
      <div id="routes"></div>
      <div class="acts" id="route-acts" style="margin-top:6px"></div>
    </div>

    <div class="panel">
      <h2>Pillars <span class="tiny muted" id="trust-rung"></span></h2>
      <div id="pillars"></div>
      <div id="locked"></div>
    </div>

    <div class="panel">
      <h2>The Corpus <span class="tiny muted" id="corpus-sum"></span></h2>
      <div class="chest" id="chest"></div>
    </div>

    <div class="panel">
      <h2>Goods</h2>
      <div class="tokens" id="goods"></div>
    </div>

    <div class="panel">
      <h2>Chronicle</h2>
      <div id="log"></div>
    </div>
  </aside>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
