<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paramountcy</title>
<link rel="stylesheet" href="../../packages/ui/src/kit.css">
<style>
  /* The Recite Game: one screen, one card, one bar, two doors.
     Everything the old client stacked on this page — panels, lenses, mode
     tabs, drawers — is deliberately gone. */
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--table, #23404a); }

  #stage { position: fixed; inset: 0; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    cursor: grab; touch-action: none; }
  #map:active { cursor: grabbing; }

  /* ── Top strip ─────────────────────────────────────────────────────── */
  #hud { position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; z-index: 5;
    background: var(--paper); border: 1px solid var(--rule);
    box-shadow: var(--shadow-lift); padding: 7px 14px; font-size: 13px; }
  #hud .sep { width: 1px; height: 18px; background: var(--rule); }
  #day { font-weight: 700; }
  #era { color: var(--ink-soft); font-family: var(--mono); font-size: 11px; }
  #lvl { color: var(--gold, #C9A227); font-size: 11px; font-weight: 700;
    letter-spacing: .04em; }
  #speed { font-size: 13px; padding: 2px 9px; cursor: pointer; }
  .meter { display: flex; align-items: center; gap: 6px; }
  .meter .k { font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-soft); }
  .meter .bar { width: 64px; height: 8px; border: 1px solid var(--ink);
    background: var(--sheet-shade); position: relative; }
  .meter .bar i { position: absolute; inset: 0 auto 0 0; display: block; }
  #orderbar { background: var(--gold, #C9A227); }
  #foodbar { background: #7A8F52; }
  #popn { font-weight: 700; font-variant-numeric: tabular-nums; }
  #money { font-weight: 700; color: var(--warn); }

  /* ── The card & the bar ────────────────────────────────────────────── */
  /* The card is a label, not a lid: only its Read button takes clicks, so a
     camp sitting behind it on the map can still be tapped. */
  #cardslot { position: absolute; left: 50%; bottom: 66px; transform: translateX(-50%);
    z-index: 5; width: min(430px, 86vw); background: var(--paper);
    border: 1px solid var(--ink); box-shadow: var(--shadow-lift);
    padding: 12px 16px 10px; text-align: center; pointer-events: none; }
  #cardslot #btnRead { pointer-events: auto; }
  #cardbook { font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-soft); }
  #cardtitle { font-size: 16px; font-weight: 700; margin: 2px 0 4px;
    text-wrap: balance; }
  #cardtext { font-size: 12.5px; line-height: 1.5; color: var(--ink-soft);
    font-style: italic; }
  #recitehint { font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-faint); margin-top: 8px; }

  #btnRead { margin-top: 9px; font-size: 11px; padding: 4px 10px; }
  #btnRead[hidden] { display: none; }
  #cardslot.unread #cardtext { opacity: .55; }
  #cardslot.needsread { animation: shake .5s; }
  @keyframes shake { 10%,90% { transform: translateX(-51%) } 30%,70% { transform: translateX(-49%) } }

  /* The chant track: a marker sweeps toward the strike zone once a beat. */
  #recitebar { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%);
    z-index: 5; width: min(430px, 86vw); height: 26px; background: var(--sheet);
    border: 1px solid var(--ink); overflow: hidden; opacity: 0; transition: opacity .12s; }
  #recitebar.on { opacity: 1; }
  #recitebar.hit { box-shadow: inset 0 0 0 2px var(--gold, #C9A227); }
  #recitebar.miss { box-shadow: inset 0 0 0 2px var(--loss, #8a3324); }
  #recitefill { display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, rgba(201,162,39,.45), rgba(219,180,58,.45)); }
  /* The gold zone is exactly HIT_WINDOW_MS wide as a fraction of BEAT_MS
     (240/900), so what looks like a hit IS a hit — the marker parks at the
     right edge during the short grace just after the beat. */
  #chantzone { position: absolute; top: 0; bottom: 0; right: 0; width: 26.7%;
    background: rgba(201,162,39,.3); border-left: 1px solid var(--gold, #C9A227); }
  #chantmarker { position: absolute; top: 0; bottom: 0; width: 3px; left: 0;
    background: var(--ink); }
  #chantpips { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; gap: 4px; pointer-events: none; }
  #chantpips i { width: 7px; height: 7px; border: 1px solid var(--ink);
    background: transparent; display: block; }
  #chantpips i.on { background: var(--gold, #C9A227); }
  #chantpips .misses { color: var(--loss, #8a3324); font-size: 10px; margin-left: 6px;
    letter-spacing: 2px; }

  /* ── The two doors ─────────────────────────────────────────────────── */
  .door { position: absolute; bottom: 14px; z-index: 5; font-size: 13px;
    padding: 8px 14px; cursor: pointer; background: var(--paper);
    border: 1px solid var(--rule); box-shadow: var(--shadow-lift); }
  .door:hover { box-shadow: var(--shadow-contact); }
  #btnCards { left: 14px; }
  #btnFund { left: 14px; bottom: 58px; }
  #btnFund[hidden] { display: none; }
  #btnBooks { right: 14px; }

  .fund-row { display: flex; align-items: center; gap: 14px; padding: 12px 14px;
    border: 1px solid var(--rule); background: var(--sheet); margin-bottom: 8px; }
  .fund-row.done { background: var(--paper); }
  .fr-icon { font-size: 22px; }
  .fr-main { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .fr-blurb { font-size: 12px; color: var(--ink-soft); }
  .fr-built { font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--gold, #C9A227); font-weight: 700; }

  /* ── Full-screen pages ─────────────────────────────────────────────── */
  .page { position: fixed; inset: 0; z-index: 20; background: var(--paper);
    overflow-y: auto; padding: 26px clamp(16px, 6vw, 72px); }
  .page[hidden] { display: none; }
  .page h1 { margin: 0 0 4px; font-size: 26px; }
  .page .lede { color: var(--ink-soft); font-size: 13px; margin: 0 0 20px; }
  .page .back { position: fixed; top: 14px; right: 18px; font-size: 13px;
    padding: 6px 12px; cursor: pointer; background: var(--sheet);
    border: 1px solid var(--rule); }

  /* ── The binder ────────────────────────────────────────────────────── */
  .binder-books { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
  .binder-books .chip { font-size: 11px; border: 1px solid var(--rule);
    background: var(--sheet); padding: 3px 8px; }
  .binder-books .chip b { color: var(--gold, #C9A227); }
  #binder-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px; padding-bottom: 40px; }
  .bcard { position: relative; min-height: 92px; border: 1px solid var(--ink);
    background: var(--sheet); padding: 8px 9px; text-align: left; font: inherit;
    cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
  .bcard.fresh { box-shadow: inset 0 0 0 2px var(--gold, #C9A227); }
  .bcard.done { background: var(--paper); }
  .bcard:hover:not(.locked) { box-shadow: var(--shadow-contact); }
  .bcard .bicon { font-size: 15px; }
  .bcard .btitle { font-size: 11.5px; line-height: 1.35; font-weight: 600; }
  .bcard .bnew { position: absolute; top: 6px; right: 6px; font-size: 9px;
    letter-spacing: .1em; color: var(--gold, #C9A227); font-weight: 700; }
  .bcard .bcount { position: absolute; top: 6px; right: 6px; font-size: 10px;
    color: var(--ink-faint); font-family: var(--mono); }
  .bcard.locked { background: #3e3427; border-color: #2a2118; cursor: default;
    align-items: center; justify-content: center; }
  .bcard.locked .bq { font-size: 26px; color: rgba(232,220,194,.28); }
  .bcard.locked .blv { position: absolute; bottom: 6px; right: 8px; font-size: 10px;
    color: rgba(232,220,194,.5); font-family: var(--mono); }

  /* ── The library ───────────────────────────────────────────────────── */
  .lib-tabs { display: flex; gap: 6px; margin: 0 0 14px; }
  .shelf-row { display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 9px 10px; border: 1px solid var(--rule); background: var(--sheet);
    margin-bottom: 6px; cursor: pointer; font: inherit; text-align: left; }
  .shelf-row:hover { box-shadow: var(--shadow-contact); }
  .sr-icon { font-size: 17px; }
  .sr-title { font-weight: 700; font-size: 13.5px; flex: 0 1 auto; }
  .sr-bar { flex: 1; height: 8px; border: 1px solid var(--ink);
    background: var(--sheet-shade); position: relative; min-width: 60px; }
  .sr-bar i { position: absolute; inset: 0 auto 0 0; background: var(--gold, #C9A227); }
  .sr-n { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
  .shelf-pages { display: flex; flex-wrap: wrap; gap: 4px; margin: -2px 0 14px; }
  .pchip { width: 26px; height: 26px; border: 1px solid var(--rule); background: var(--sheet);
    font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .pchip.done { background: var(--paper); color: var(--gold, #C9A227); font-weight: 700; }
  .pchip.locked { opacity: .45; cursor: default; }
  .bo-title { margin: 10px 0 2px; }
  .bo-pages { display: flex; flex-direction: column; gap: 4px; padding-bottom: 40px; }
  .bo-page { display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border: 1px solid var(--rule); background: var(--sheet); font: inherit;
    text-align: left; cursor: pointer; }
  .bo-page:hover:not(.locked) { box-shadow: var(--shadow-contact); }
  .bo-page.done { background: var(--paper); }
  .bo-page.locked { opacity: .5; cursor: default; }
  .bo-page .bp-t { flex: 1; font-size: 13px; }
  .bo-page .bp-n { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); }

  /* ── The card detail ───────────────────────────────────────────────── */
  .card-detail { position: fixed; inset: 0; z-index: 30; display: grid;
    place-items: center; background: rgba(42,33,24,.45); padding: 20px; }
  .card-detail[hidden] { display: none; }
  .cd-box { background: var(--paper); border: 1px solid var(--ink);
    box-shadow: var(--shadow-lift); max-width: 560px; width: 100%;
    max-height: 84vh; overflow-y: auto; padding: 18px 22px; }
  .cd-book { font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-soft); }
  .cd-box h2 { margin: 4px 0 2px; font-size: 20px; text-wrap: balance; }
  .cd-hi { color: var(--ink-soft); font-size: 14px; margin-bottom: 6px; }
  .cd-recite { font-style: italic; font-size: 14px; margin: 10px 0; }
  .cd-text { font-size: 13px; line-height: 1.6; color: var(--ink-soft); white-space: pre-line; }
  .cd-moral { font-size: 13px; }
  .cd-origin { font-size: 11px; color: var(--ink-faint); }
  .cd-row { display: flex; justify-content: space-between; align-items: center;
    gap: 10px; margin-top: 14px; }

  /* ── Bring your own book ───────────────────────────────────────────── */
  .upload-box { margin: 26px 0 60px; border: 1px dashed var(--rule);
    background: var(--sheet); padding: 14px 16px; }
  .upload-box h2 { margin: 0 0 4px; font-size: 16px; }
  .ub-title { width: 100%; font: inherit; padding: 7px 9px; margin: 8px 0 6px;
    border: 1px solid var(--rule); background: var(--paper); }
  .ub-text { width: 100%; min-height: 110px; font: inherit; font-size: 12.5px;
    padding: 7px 9px; border: 1px solid var(--rule); background: var(--paper); resize: vertical; }

  /* ── The camp close-up ─────────────────────────────────────────────── */
  #campchip { position: absolute; top: 14px; left: 14px; z-index: 6;
    display: flex; align-items: center; gap: 10px; background: var(--paper);
    border: 1px solid var(--rule); box-shadow: var(--shadow-lift);
    padding: 7px 10px 7px 13px; font-size: 13px; }
  #campchip[hidden] { display: none; }
  #campname { font-weight: 700; }
  #camppop { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); }
  #campclose { font-size: 12px; padding: 2px 8px; }
  /* Under the chip, not at the bottom: the card slot owns the bottom centre. */
  #camphint { position: absolute; top: 52px; left: 14px; max-width: min(340px, 46vw);
    z-index: 5; font-size: 11.5px; line-height: 1.45; color: var(--ink-soft);
    background: var(--paper); border: 1px solid var(--rule);
    padding: 5px 10px; pointer-events: none; }
  #camphint[hidden] { display: none; }

  /* ── The vibe: the table changes material with the sheet ───────────────
     Same mechanism the kit has always shipped for eras (kit.css [data-era]):
     only the paper and its shadow move. --gold is untouched, because gold
     means YOURS and nothing else, on every sheet. */
  body[data-lens="field"]     { --sheet: #D2BE95; --sheet-shade: #BCA678; --paper: #E6D9B7;
                                --lens-edge: #7A8F52; }
  body[data-lens="hearth"]    { --sheet: #DAC4A0; --sheet-shade: #C6AC82; --paper: #EEDCC0;
                                --lens-edge: #A8642B; }
  body[data-lens="order"]     { --sheet: #D3CDB6; --sheet-shade: #BDB69C; --paper: #E9E3D0;
                                --lens-edge: #3E8496; }
  body[data-lens="chronicle"] { --sheet: #CDC3AB; --sheet-shade: #B6AB90; --paper: #E4DCC8;
                                --lens-edge: #7A4E8E; }
  #stage { transition: background-color .25s ease; }
  #cardslot, #camphint, #campchip, #lenslegend, .toast, .door {
    transition: background-color .25s ease, border-color .25s ease; }

  /* ── The lens rail: sheets at the edge of the table ────────────────── */
  #lensrail { position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    z-index: 6; display: flex; flex-direction: column; gap: 7px; }
  #lensrail .lens { display: flex; align-items: center; gap: 9px; width: auto;
    height: auto; border-radius: 0; padding: 7px 12px 7px 9px; cursor: pointer;
    background: var(--paper); border: 1px solid var(--rule);
    box-shadow: var(--shadow-contact); font: inherit; font-size: 12px;
    color: var(--ink-soft); text-align: left;
    /* A sheet slides out from the edge as it comes down. */
    transform: translateX(-4px); opacity: .82;
    transition: transform .25s ease, opacity .25s ease, border-color .25s ease; }
  #lensrail .lens:hover { opacity: 1; transform: translateX(0); border-color: var(--gold); }
  #lensrail .lens[aria-pressed="true"] { opacity: 1; transform: translateX(0);
    border-color: var(--rule); border-left: 3px solid var(--lens-edge, var(--gold));
    color: var(--ink); box-shadow: var(--shadow-lift); }
  body[data-lens] #camphint { border-left: 3px solid var(--lens-edge, var(--rule)); }
  #lensrail .lens-glyph { font-size: 16px; line-height: 1; }
  #lensrail .lens-name { letter-spacing: .01em; }
  @media (max-width: 720px) {
    #lensrail .lens-name { display: none; }
    #lensrail .lens { padding: 8px; }
  }

  /* The legend: a slip naming only the pigments actually on the sheet. */
  #lenslegend { position: absolute; left: 14px; bottom: 58px; z-index: 6;
    display: flex; flex-direction: column; gap: 3px; background: var(--paper);
    border: 1px solid var(--rule); box-shadow: var(--shadow-contact);
    padding: 6px 10px; font-size: 11px; color: var(--ink-soft); }
  #lenslegend[hidden] { display: none; }
  .lg-row { display: flex; align-items: center; gap: 6px; }
  .lg-row i { width: 9px; height: 9px; border: 1px solid var(--rule); }

  /* The chip that says a sheet is narrowing the shelf, and lifts it again. */
  .chip--lens { cursor: pointer; border-color: var(--lens-edge, var(--gold));
    border-left-width: 3px; background: var(--paper); font: inherit; font-size: 11.5px;
    margin-bottom: 10px; }
  .chip--lens:hover { background: var(--sheet-shade); }

  /* ── Toasts ────────────────────────────────────────────────────────── */
  #toasts { position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
    z-index: 6; display: flex; flex-direction: column; gap: 6px; align-items: center;
    pointer-events: none; }
  .toast { background: var(--paper); border: 1px solid var(--rule);
    box-shadow: var(--shadow-lift); padding: 6px 14px; font-size: 12.5px;
    transition: opacity .4s; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="map" tabindex="0" role="application"
    aria-label="The living map. Hold Space to recite the current card to the population."></canvas>

  <div id="hud">
    <span id="day">Day 0</span>
    <span id="era">6000 BCE</span>
    <span id="lvl">Lv 1</span>
    <button class="btn" id="speed" title="Speed: one day is ten seconds; press to go faster.">▸</button>
    <span class="sep"></span>
    <span class="meter" title="The population — the children you are raising."><span class="k">Pop</span><span id="popn">0</span></span>
    <span class="meter" title="Order: how far this population has come from the wild. Recite morals to raise it; it frays on its own."><span class="k">Order</span><span class="bar"><i id="orderbar"></i></span></span>
    <span class="meter" title="Food: the hunt, then the harvest. An empty pot kills."><span class="k">Food</span><span class="bar"><i id="foodbar"></i></span></span>
    <span id="money" hidden>₹ 0</span>
  </div>

  <div id="campchip" hidden>
    <span id="campname"></span>
    <span id="camppop"></span>
    <button class="btn tiny" id="campclose" title="Step back to the whole map (Esc)">✕</button>
  </div>
  <div id="camphint" hidden></div>

  <!-- The lens rail: glass sheets stacked at the edge of the table.
       Lay one down and the world answers in its language. Keys 1..n, 0 or Esc
       lifts it off again. -->
  <div id="lensrail" aria-label="Lenses: sheets to lay over the map"></div>
  <div id="lenslegend" hidden aria-label="What the colours on the sheet mean"></div>

  <div id="toasts" aria-live="polite"></div>

  <div id="cardslot">
    <div id="cardbook"></div>
    <div id="cardtitle"></div>
    <div id="cardtext"></div>
    <button class="btn tiny" id="btnRead">📖 Read it</button>
    <div id="recitehint">read it before you can teach it</div>
  </div>
  <div id="recitebar">
    <i id="recitefill"></i>
    <span id="chantzone"></span>
    <span id="chantmarker"></span>
    <span id="chantpips"></span>
  </div>

  <button class="door" id="btnCards">🃏 Cards</button>
  <button class="door" id="btnFund" hidden title="Spend the common pot on what keeps a people organized.">🛕 Fund</button>
  <button class="door" id="btnBooks">📖 Books</button>
</div>

<div class="page" id="page-cards" hidden>
  <button class="back" data-back>← back to the stage</button>
  <div id="binder-head"></div>
  <div id="binder-grid"></div>
</div>

<div class="page" id="page-books" hidden>
  <button class="back" data-back>← back to the stage</button>
  <h1>The Library</h1>
  <div id="books-body"></div>
</div>

<div class="page" id="page-fund" hidden>
  <button class="back" data-back>← back to the stage</button>
  <h1>The Common Pot</h1>
  <div id="fund-body"></div>
</div>

<script type="module" src="./src/game.js"></script>
</body>
</html>
